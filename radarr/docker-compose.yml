---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config:/config
      - ${MOVIES_PATH:-/home/dayna/Documents/homeserver/plex/media/movies}:/movies
      - ${DOWNLOADS_PATH:-/home/dayna/Documents/homeserver/downloads}:/downloads
    ports:
      - ${RADARR_PORT:-7878}:7878
    restart: unless-stopped
